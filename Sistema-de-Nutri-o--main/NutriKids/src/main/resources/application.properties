spring.application.name=NutriKids

# ========================================================
# Configuração do PostgreSQL
# ========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/nutrikids_db
spring.datasource.username=postgres
spring.datasource.password=1606
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================================
# Configuração do JPA / Hibernate
# ========================================================
# 'update': Cria ou atualiza as tabelas automaticamente de acordo com as entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inicialização do banco (já foi populado na 1ª execução, não precisa rodar novamente)
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ========================================================
# Configuração de Upload de Arquivos (Laudos e Cartas Médicas)
# ========================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

