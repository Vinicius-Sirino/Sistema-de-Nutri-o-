<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente da Maçã (Vermelho Rubi Saudável) -->
    <linearGradient id="appleGrad" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="30%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Gradiente das Folhas (Verde Nutrição) -->
    <linearGradient id="leafGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Gradiente do Cabinho -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Gradiente Dourado dos Detalhes -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sombras Suaves -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.18" flood-color="#0f172a"/>
    </filter>
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-opacity="0.22" flood-color="#881337"/>
    </filter>
  </defs>

  <!-- Cabinho de Madeira Natural -->
  <path d="M 50 32 C 50 23 54 15 62 10" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Folha Principal Verde Vibrante -->
  <g filter="url(#softShadow)">
    <path d="M 51 27 C 51 12 72 9 82 15 C 84 30 65 37 51 27 Z" fill="url(#leafGrad)"/>
    <!-- Nervura da Folha -->
    <path d="M 54 26 Q 67 21 78 17" stroke="#bbf7d0" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Broto / Folhinha Menor -->
  <path d="M 46 29 C 43 21 34 20 29 25 C 31 33 41 34 46 29 Z" fill="#22c55e" opacity="0.85"/>

  <!-- Corpo da Maçã com Silhueta Amigável -->
  <g filter="url(#appleShadow)">
    <path d="M 50 38
             C 42 27 18 26 9 45
             C 0 64 13 91 36 99
             C 43 101.5 47 99.5 50 97.5
             C 53 99.5 57 101.5 64 99
             C 87 91 100 64 91 45
             C 82 26 58 27 50 38 Z"
          fill="url(#appleGrad)"/>

    <!-- Brilho Glossy Superior Esquerdo -->
    <path d="M 19 43
             C 24 36 36 35 43 39
             C 37 42 29 45 22 52
             C 20 49 19 46 19 43 Z"
          fill="#ffffff" opacity="0.45"/>

    <ellipse cx="18" cy="56" rx="3" ry="6.5" transform="rotate(-20 18 56)" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Sorriso Infantil Saudável no Centro da Maçã -->
  <path d="M 34 68 Q 50 82 66 68" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" fill="none"/>

  <!-- Bochechinhas Douradas -->
  <circle cx="30" cy="66" r="3" fill="url(#goldGrad)"/>
  <circle cx="70" cy="66" r="3" fill="url(#goldGrad)"/>

  <!-- Estrelinhas Douradas de Qualidade Nutricional -->
  <path d="M 76 38 L 78 42 L 82 44 L 78 46 L 76 50 L 74 46 L 70 44 L 74 42 Z" fill="url(#goldGrad)"/>
  <circle cx="84" cy="56" r="1.8" fill="url(#goldGrad)"/>
</svg>
